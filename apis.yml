name: Brain
description: 'Brain Co. builds agent-native operating systems for institutions across
  the public and private sectors. Its Atlas platform powers GovOS — permitting, licensing,
  claims, and casework for government agencies at national scale — and InsuranceOS
  for underwriting, claims, authorization, and insurance operations, with an emphasis
  on sovereign-grade security and vendor neutrality. Founded in 2025 and based in San
  Francisco, the company was cofounded by Elad Gil, Jared Kushner, and Luis Videgaray,
  with a team drawn from Google, DeepMind, NVIDIA, Palantir, and Tesla. Brain Co. does
  not currently publish a public API, developer portal, SDKs, or OpenAPI definitions;
  this profile tracks its public web surface (news, trust center, privacy and terms)
  pending any future developer program.'
